services:
  # Keep the original interactive CLI available for local/manual use.
  agent:
    build: .
    container_name: terminal-coding-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    command: ["node", "/app/dist/cli.js"]

    environment:
      WORKSPACE: /workspace
      SANDBOX_URL: http://sandbox:8787
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}

    env_file:
      - .env

    volumes:
      - ./workspace:/workspace

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

    networks:
      - default
      - sandbox-net

  api:
    build: .
    container_name: terminal-agent-api
    command: ["node", "/app/dist/api.js"]
    environment:
      API_PORT: "3000"
      WORKER_URL: http://worker:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      worker:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    networks:
      - default

  worker:
    build: .
    container_name: terminal-agent-worker
    command: ["node", "/app/dist/worker.js"]
    working_dir: /workspace
    environment:
      WORKER_PORT: "3001"
      WORKSPACE: /workspace
      SANDBOX_URL: http://sandbox:8787
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}
    env_file:
      - .env
    volumes:
      - ./workspace:/workspace
    depends_on:
      sandbox:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped
    networks:
      - default
      - sandbox-net

  sandbox:
    build:
      context: ./sandbox
    container_name: terminal-agent-sandbox
    working_dir: /sandbox
    environment:
      PORT: "8787"
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}
    volumes:
      - ./workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    init: true
    restart: unless-stopped
    networks:
      - sandbox-net

networks:
  default:
  sandbox-net:
    internal: true
